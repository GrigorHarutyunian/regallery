<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Re Gallery for Shopify — AI Gallery App That Writes Your Image SEO
    </title>
    <meta
      name="description"
      content="The only Shopify gallery app with built-in AI that writes alt text, titles, and image descriptions for every product photo. Beautiful layouts. Zero manual SEO."
    />
    <link rel="icon" type="image/webp" href="./assets/logo.webp" />
    <link rel="apple-touch-icon" href="./assets/logo.webp" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script defer>
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                canvas: "#0D0D14",
                "canvas-card": "#13131F",
                "canvas-border": "#1E1E2E",
                violet: {
                  DEFAULT: "rgb(var(--primary-rgb) / <alpha-value>)",
                  soft: "var(--primary-soft)",
                  dim: "var(--primary-dim)",
                  glow: "var(--primary-glow)",
                },
                primary: {
                  DEFAULT: "rgb(var(--primary-rgb) / <alpha-value>)",
                  soft: "var(--primary-soft)",
                  dim: "var(--primary-dim)",
                  light: "var(--primary-light)",
                },
                amber: { DEFAULT: "#F59E0B", soft: "#FEF3C7" },
                green: { DEFAULT: "#22C55E", soft: "#DCFCE7" },
                ink: "#0D0D14",
                "ink-soft": "#64748B",
                paper: "#FAFAFA",
              },
              fontFamily: {
                sans: ['"Inter"', "system-ui", "sans-serif"],
              },
              borderRadius: {
                lg: "var(--radius)",
                xl: "var(--radius)",
                "2xl": "var(--radius)",
                "3xl": "var(--radius)",
              },
              maxWidth: {
                "7xl": "var(--content-max)",
              },
            },
          },
        },
      };
    </script>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    /></noscript>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/demos.css" />
    <link rel="stylesheet" href="./css/layouts.css" />
    <link rel="stylesheet" href="./css/hover.css" />
    <link rel="stylesheet" href="./css/faq.css" />
    <link rel="stylesheet" href="./css/pricing.css" />
    <link rel="stylesheet" href="./css/video-modal.css" />
  </head>
  <body>
    <div id="nav-mount"></div>
    <main>
      <section id="hero" class="relative overflow-hidden">
        <div id="hero-mount"></div>
      </section>
      <section id="layouts" class="gallery-layouts-section">
        <div id="layouts-mount"></div>
      </section>
      <section id="problem" class="section-paper py-24">
        <div id="problem-mount"></div>
      </section>
      <section id="features" class="section-dim py-24">
        <div id="features-mount"></div>
      </section>
      <section id="template_library" class="gallery-demo-section">
        <div id="template-library-mount"></div>
      </section>
      <section id="why" class="section-dim py-24">
        <div id="why-mount"></div>
      </section>
      <section id="lightbox_showcase" class="gallery-demo-section">
        <div id="lightbox-showcase-mount"></div>
      </section>
      <section id="hover" class="hover-effects-section">
        <div id="hover-mount"></div>
      </section>
      <section id="pricing" class="pricing-section-dark">
        <div id="pricing-mount"></div>
      </section>
      <section id="faq" class="section-paper py-24">
        <div id="faq-mount"></div>
      </section>
      <section id="cta" class="section-dim py-24">
        <div id="cta-mount"></div>
      </section>
    </main>
    <div id="footer-mount"></div>

    <script src="./js/reacg-data.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/demos-loader.js"></script>
  </body>
</html>
